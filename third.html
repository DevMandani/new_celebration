<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ffb6f9, #ffd1dc);
            font-family: "Poppins", sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0px 0px 10px #ff5ac1;
            margin-top: 20px;
            animation: fadeIn 2s ease-out;
        }

        .photos-section {
            margin-top: 30px;
        }

        /* 3D PHOTO CARD */
        .photo-card {
            width: 85%;
            max-width: 350px;
            margin: 25px auto;
            background: rgba(255, 255, 255, 0.25);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 0, 123, 0.35);
            transform: perspective(900px) rotateY(0deg);
            transition: 0.6s ease;
            animation: fadeIn 1.3s ease-out;
        }

        .photo-card:hover {
            transform: perspective(900px) rotateY(15deg) scale(1.03);
        }

        .photo-card img {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 79, 168, 0.7);
        }

        /* STORY TEXT */
        .story {
            margin-top: 15px;
            font-size: 1.05rem;
            color: #ffffff;
            font-weight: 500;
            line-height: 1.6;
            text-shadow: 
                0 0 8px rgba(255, 90, 180, 0.9),
                0 0 12px rgba(255, 90, 180, 0.6),
                0 0 16px rgba(255, 90, 180, 0.4);
            animation: textFade 2s ease-out;
        }

        /* VIDEO SECTION */
        .video-section {
            margin: 40px auto;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.25);
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 0, 123, 0.35);
            animation: fadeIn 2s ease-out;
        }

        .video-section video {
            width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 79, 168, 0.7);
        }

        .video-caption {
            margin-top: 12px;
            font-size: 1.1rem;
            color: white;
            font-weight: 600;
            text-shadow: 0 0 12px #ff5ac1;
        }

        /* ANIMATIONS */
        @keyframes textFade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }

        /* CONFETTI */
        .confetti {
            position: fixed;
            top: -10px;
            width: 10px;
            height: 10px;
            opacity: 0.9;
            z-index: 10000;
            animation: confettiFall 3.5s linear infinite;
        }

        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

    </style>
</head>

<body>

    <h1>🎉 Happiest Birthday ...! 🎂💖</h1>

    <!-- PHOTO SECTION -->
    <div class="photos-section">

        <div class="photo-card">
            <img src="images/img4.jpeg" alt="Photo 1">
            <div class="story">
                🌸 You mean more than you know.
            </div>
        </div>

        <div class="photo-card">
            <img src="images/img5.jpeg" alt="Photo 2">
            <div class="story">
                ✨ Grateful for you, always.
            </div>
        </div>

        <div class="photo-card">
            <img src="images/img6.jpeg" alt="Photo 3">
            <div class="story">
                💖 You keep me alive inside.
            </div>
        </div>

    </div>

  


    <!-- CONFETTI -->
    <script>
        function createConfetti() {
            const confetti = document.createElement("div");
            confetti.classList.add("confetti");

            const colors = ["#ff4fa8", "#ffdd00", "#ffffff", "#00e1ff", "#ff7b00"];
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

            confetti.style.left = Math.random() * 100 + "vw";
            confetti.style.width = confetti.style.height = (8 + Math.random() * 8) + "px";
            confetti.style.animationDuration = (2 + Math.random() * 2) + "s";

            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
        }
        setInterval(createConfetti, 150);
    </script>

    <!-- MUSIC -->
    <audio id="bgMusic" preload="auto">
        <source src="music/new.mp3" type="audio/mpeg">
    </audio>

    <script>
        window.addEventListener("load", () => {
            const audio = document.getElementById("bgMusic");
            if (localStorage.getItem("musicPlaying") === "yes") {
                audio.volume = 1.0;
                audio.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
